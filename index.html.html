<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0810">
<title>Jetpack to Jakarta</title>
<style>
  /* The page is exactly the visible window: 100dvh tracks mobile browser bars
     as they slide in and out, where plain 100vh would leave a gap. */
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#0a0810;overflow:hidden;
    position:fixed;inset:0;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

  #fs{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));
    width:34px;height:34px;padding:0;border:2px solid #6d7a92;background:rgba(10,8,22,.55);
    color:#cfd8ea;font:16px/1 monospace;cursor:pointer;opacity:.55;z-index:5}
  #fs:hover{opacity:1}
  /* Pause sits left of the full-screen button and only shows while flying. */
  #pz{position:fixed;right:calc(max(8px,env(safe-area-inset-right)) + 42px);
    bottom:max(8px,env(safe-area-inset-bottom));width:34px;height:34px;padding:0;display:none;
    border:2px solid #6d7a92;background:rgba(10,8,22,.55);color:#cfd8ea;
    font:bold 15px/1 'Courier New',monospace;letter-spacing:-2px;cursor:pointer;opacity:.7;z-index:5}
  #pz:hover{opacity:1}
  #pm{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(8,6,20,.74);font-family:'Courier New',monospace}
  #pm.on{display:flex}
  #pm .panel{display:flex;flex-direction:column;gap:12px;min-width:min(260px,72vw);text-align:center}
  #pm h2{margin:0 0 6px;color:#ffe9a8;font-size:26px;letter-spacing:5px}
  #pm button{padding:13px 18px;border:3px solid #ffe9a8;background:#14102a;color:#ffe9a8;
    font:bold 17px/1 'Courier New',monospace;letter-spacing:3px;cursor:pointer;
    box-shadow:0 4px 0 #6d5a2a;touch-action:manipulation}
  #pm button:hover,#pm button:focus-visible{background:#ffe9a8;color:#14102a;outline:none}
  #pm button:active{transform:translateY(3px);box-shadow:0 1px 0 #6d5a2a}
  #pm button.sec{border-color:#8aa4d8;color:#bcd2ff;box-shadow:0 4px 0 #34476e}
  #pm button.sec:hover,#pm button.sec:focus-visible{background:#bcd2ff;color:#14102a}

  /* Shown in portrait: the game is paused behind it until the phone is turned. */
  #rot{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;background:#0a0810;
    color:#ffe9a8;font-family:"Courier New",monospace;text-align:center;padding:24px}
  #rot.on{display:flex}
  #rot h1{margin:0;font-size:22px;letter-spacing:2px;line-height:1.35}
  #rot p{margin:0;font-size:15px;color:#bcd2ff;letter-spacing:1px}
  .phone{width:54px;height:92px;border:6px solid #ffe9a8;border-radius:9px;position:relative;
    animation:turn 2.4s ease-in-out infinite;box-shadow:0 0 0 3px #0a0810,0 0 0 5px #6d7a92}
  .phone::before{content:"";position:absolute;left:50%;top:5px;width:16px;height:4px;
    margin-left:-8px;background:#ffe9a8;border-radius:2px}
  .phone::after{content:"";position:absolute;inset:18px 5px 8px;background:#2f5b9a;
    background-image:linear-gradient(#ffd08a,#ffd08a);background-size:100% 30%;
    background-repeat:no-repeat;background-position:bottom}
  @keyframes turn{0%,18%{transform:rotate(0)}52%,82%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fs" type="button" aria-label="Toggle full screen" title="Full screen (F)">&#9974;</button>
<button id="pz" type="button" aria-label="Pause" title="Pause (P)">II</button>
<div id="pm" role="dialog" aria-label="Paused">
  <div class="panel">
    <h2>PAUSED</h2>
    <button type="button" data-act="resume">RESUME</button>
    <button type="button" data-act="retry" class="sec">RETRY</button>
    <button type="button" data-act="home" class="sec">HOME</button>
  </div>
</div>
<div id="rot" role="alert">
  <div class="phone"></div>
  <h1>PLEASE TURN YOUR PHONE<br>SIDEWAYS</h1>
  <p>JETPACK TO JAKARTA PLAYS IN LANDSCAPE</p>
</div>
<script>
"use strict";
// The picture adapts to the screen's shape instead of letterboxing it. The game
// was designed on a 320x180 canvas; that is now a *minimum*. A wider screen
// (a phone in landscape) gets extra width, a boxier one (iPad, laptop) gets
// extra height, so the canvas always has the same aspect ratio as the window.
let VW = 320, VH = 180;
let OX = 0, OY = 0;                 // how far the 320x180 design area sits in from the edges
const DESIGN_W = 320, DESIGN_H = 180;
const MAX_W = 480, MAX_H = 300;     // beyond these (ultra-wide, near-square) thin bars are accepted
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;
ctx.imageSmoothingEnabled = false;

function setLogicalSize(w, h) {
  if (w === VW && h === VH) return;
  VW = w; VH = h;
  cv.width = w; cv.height = h;               // reallocating resets the context...
  ctx.imageSmoothingEnabled = false;         // ...so turn smoothing back off
  GROUND = VH - 22;
  OX = Math.floor((VW - DESIGN_W) / 2);
  OY = Math.floor((VH - DESIGN_H) / 2);
}

// Draw fixed-position content (written for 320x180) centred in whatever size we
// have. `dy` lets a screen sit at the top (0) or vertically centred (OY).
let DWV = 0;                                  // centring width while inside fg()
function fg(fn, dy) {
  ctx.save();
  ctx.translate(OX, dy || 0);
  DWV = DESIGN_W;
  try { fn(); } finally { DWV = 0; ctx.restore(); }
}

// Fill the window: pick a canvas shape that matches it, then scale to fit.
function resize() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  const a = w / h;
  let lw, lh;
  if (a >= DESIGN_W / DESIGN_H) {             // wider than 16:9 -> add width
    lh = DESIGN_H; lw = Math.min(MAX_W, Math.round(DESIGN_H * a));
  } else {                                    // boxier than 16:9 -> add height
    lw = DESIGN_W; lh = Math.min(MAX_H, Math.round(DESIGN_W / a));
  }
  setLogicalSize(lw, lh);
  const s = Math.min(w / VW, h / VH);
  let cw = Math.round(VW * s), ch = Math.round(VH * s);
  if (Math.abs(cw - w) <= 3) cw = w;          // absorb rounding so no hairline bar is left
  if (Math.abs(ch - h) <= 3) ch = h;
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  checkOrientation();
}

// Portrait on a phone/tablet-sized screen: show the "turn your phone" notice
// and hold the game paused until it is landscape.
let paused = false;
const rotEl = document.getElementById('rot');
function checkOrientation() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
  paused = h > w && w < 900;
  rotEl.classList.toggle('on', paused);
  if (paused) thrust = false;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

// Full screen: button, F key, and automatically on the first tap on touch devices.
const fsBtn = document.getElementById('fs');
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (fsOn()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        const p = req.call(el);
        const lock = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
        if (p && p.then) p.then(lock).catch(() => {}); else lock();
      }
    }
  } catch (e) {}
}
fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); fsBtn.blur(); });
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());
fsBtn.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
document.addEventListener('fullscreenchange', () => setTimeout(resize, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 60));

/* ---------------------------------------------------------------- 3x5 font */
const FONT = {
  A:"25755",B:"65656",C:"34443",D:"65556",E:"74647",F:"74644",G:"34553",H:"55755",
  I:"72227",J:"11152",K:"55655",L:"44447",M:"57555",N:"65555",O:"25552",P:"65644",
  Q:"25563",R:"65655",S:"34216",T:"72222",U:"55557",V:"55552",W:"55575",X:"55255",
  Y:"55222",Z:"71247",
  "0":"75557","1":"26227","2":"71747","3":"71317","4":"55711","5":"74717",
  "6":"74757","7":"71222","8":"75757","9":"75717",
  ".":"00002",",":"00022","!":"22202","?":"61202","-":"00700","'":"22000",
  ":":"02020","/":"11244","+":"02720","=":"07070","(":"12221",")":"42224",
  "<":"12421",">":"42124","*":"05250"
};
function textW(s, sc = 1) { return String(s).length * 4 * sc - sc; }
function text(s, x, y, col, sc = 1) {
  ctx.fillStyle = col;
  s = String(s).toUpperCase();
  let cx = Math.round(x);
  for (const c of s) {
    if (c !== ' ') {
      const g = FONT[c];
      if (g) for (let r = 0; r < 5; r++) {
        const bits = +g[r];
        for (let b = 0; b < 3; b++) if (bits & (4 >> b)) ctx.fillRect(cx + b * sc, Math.round(y) + r * sc, sc, sc);
      }
    }
    cx += 4 * sc;
  }
}
function ctext(s, y, col, sc = 1) { text(s, ((DWV || VW) - textW(s, sc)) / 2, y, col, sc); }

/* -------------------------------------------------------------- pixel util */
function hx(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgb(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function hash(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function pxLine(x1, y1, x2, y2, col, th) {
  const n = Math.ceil(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1))) || 1;
  ctx.fillStyle = col; const o = th >> 1;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    ctx.fillRect(Math.round(x1 + (x2 - x1) * t) - o, Math.round(y1 + (y2 - y1) * t) - o, th, th);
  }
}
function drawSprite(map, pal, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + (flip ? row.length - 1 - c : c), y + r, 1, 1);
    }
  }
}
// Append ?lab to the URL to inspect every sprite blown up, one source of truth.
const LAB = location.search.indexOf('lab') >= 0;
function drawSpriteBig(map, pal, x, y, s) {
  for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++) {
    const col = pal[map[r][c]];
    if (col) { ctx.fillStyle = col; ctx.fillRect(x + c * s, y + r * s, s, s); }
  }
}
function drawLab() {
  rect(0, 0, VW, VH, '#6a7a96');
  const items = [
    ['AIKI', HERO_RUN1, P_PAL], ['FLY', HERO_FLY, P_PAL],
    ['IVONNE', GIRL1, G_PAL], ['CAT', CAT1, C_PAL],
    ['WHEY', WHEY, W_PAL], ['BULDAK', BULDAK, B_PAL]
  ];
  let x = 6;
  for (const [name, map, pal] of items) {
    const w = map[0].length * 3;
    drawSpriteBig(map, pal, x, 22, 3);
    text(name, x, 14, '#ffffff', 1);
    text(map[0].length + 'X' + map.length, x, 22 + map.length * 3 + 4, '#d0d8e8', 1);
    x += w + 8;
  }
  text('SPRITE LAB - ?LAB', 6, 170, '#c8d4e8', 1);
}
function segDist(x1, y1, x2, y2, px, py) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

/* ------------------------------------------------------------------ sprites */
// Chunky outlined style: every figure carries a dark keyline, warm skin,
// and a hazard-striped jetpack.
const P_PAL = { o:'#231f20', O:'#a8623a', h:'#141118', H:'#2e2a34',
                f:'#eba465', F:'#c9813f', e:'#1c1820', G:'#2b2630',
                w:'#ffffff', i:'#1a1620', b:'#1c1a20', B:'#2a2730',
                p:'#3a3f48', P:'#2b2f36', s:'#33373e', S:'#52575f',
                j:'#f2c233', J:'#c9941a', m:'#b8bcc8', M:'#7a8090', t:'#6b4a2a' };
// Aiki, 20x32. Realistic build from the photo reference: textured black hair,
// thin wire glasses with brows above them, open grin, black tee with short
// sleeves and bare forearms, charcoal jeans.
const HERO_HEAD = [
  "......oooooo......","....oohhhhhhoo....","...ohhhhhhhhhho...",
  "...ohhHhhhhhhho...","...ohfhhhhhhhho...","...ohffhhfhhffo...",
  "...ohffffffffho...","...ohwiffffwiho...","...ohiiffffiiho...",
  "...ohffffffffho...","....offfffffo....."
];
// jetpack strapped to his back; bare forearms hang at his sides
// Every torso row is locked to the same centre line as the head (col 10.5),
// otherwise the body visibly leans as it goes down.
const HERO_BODY = [
  "ojjo.obbbbbbo.....","ojjo.obbbbbbo.....","oJJo.obbbbbbo.....",
  "ojjo.Ofbbbbfo.....","ommo.Ofbbbbfo.....",".oo..Ofbbbbfo.....",
  ".....oobbbboo.....","......obbbbo......"
];
// Mario-style 3-pose walk: contact (feet apart) -> passing (feet together) ->
// contact again shifted the other way. Played A-B-C-B so the weight rocks
// side to side instead of just toggling.
const LEGS_A = [                                  // contact, feet apart
  "......oppppo......","......oppppo......","......oppppo......",
  ".....opp..ppo.....",".....opp..ppo.....","....osso..osso....",
  "....oooo..oooo...."];
const LEGS_B = [                                  // passing, feet together
  "......oppppo......","......oppppo......","......oppppo......",
  "......oppppo......","......oppppo......",".....ossoosso.....",
  ".....oooooooo....."];
const LEGS_C = [                                  // contact, other way
  "......oppppo......","......oppppo......","......oppppo......",
  "......opp..ppo....","......opp..ppo....",".....osso..osso...",
  ".....oooo..oooo..."];
const HERO_RUN1 = HERO_HEAD.concat(HERO_BODY, LEGS_A);
const HERO_RUN2 = HERO_HEAD.concat(HERO_BODY, LEGS_B);
const HERO_RUN3 = HERO_HEAD.concat(HERO_BODY, LEGS_C);
const HERO_WALK = [HERO_RUN1, HERO_RUN2, HERO_RUN3, HERO_RUN2];
// Flying: the whole figure leans forward - head furthest ahead, torso a little
// behind it, legs trailing - so it reads as jetpack thrust.
const HERO_FLY = [
  "........oooooo....","......oohhhhhhoo..",".....ohhhhhhhhhho.",
  ".....ohhHhhhhhhho.",".....ohfhhhhhhhho.",".....ohffhhfhhffo.",
  ".....ohffffffffho.",".....ohwiffffwiho.",".....ohiiffffiiho.",
  ".....ohffffffffho.","......offfffffo...",
  ".ojjo.obbbbbbo....",".ojjo.obbbbbbo....",".oJJo.obbbbbbo....",
  ".ojjo.Ofbbbbfo....",".ommo.Ofbbbbfo....","..oo..Ofbbbbfo....",
  "......oobbbboo....",".......obbbbo.....",
  "......oppppo......",".....oppppo.......",".....oppppo.......",
  "....oppppo........","....oppppo........","...ossoosso.......",
  "...oooooooo......."];
// at the reunion he shrugs the pack off
const NOPACK_BODY = [
  ".....obbbbbbo.....",".....obbbbbbo.....",".....obbbbbbo.....",
  ".....Ofbbbbfo.....",".....Ofbbbbfo.....",".....Ofbbbbfo.....",
  ".....oobbbboo.....","......obbbbo......"];
const HERO_NOPACK = HERO_HEAD.concat(NOPACK_BODY, LEGS_A);
// He only straps the pack on in Morocco, so the Jakarta scenes need a
// walk cycle without it.
const NOPACK_WALK = [
  HERO_HEAD.concat(NOPACK_BODY, LEGS_A), HERO_HEAD.concat(NOPACK_BODY, LEGS_B),
  HERO_HEAD.concat(NOPACK_BODY, LEGS_C), HERO_HEAD.concat(NOPACK_BODY, LEGS_B)
];
const JETPACK = [
  ".ojjo.","ojjjjo","ojJJjo","ojjjjo","ojJJjo","ojjjjo",
  "ojJJjo","ommmmo",".oMMo.",".oJJo.","..oo.."
];
// Ivonne - fair skin, long black hair, light grey shirt
const G_PAL = { o:'#14101a', h:'#171320', H:'#2e2838', f:'#f7cdb0', F:'#dda58a',
                e:'#2a2028', g:'#d8dce4', G:'#b0b6c2', p:'#39404f', s:'#e8e8ee', w:'#ffffff', i:'#17131c' };
// Hair falls OUTSIDE the shirt outline as separate strands, so she reads as
// a girl with long hair rather than someone in a hood.
// 16x30 - a touch shorter than Aiki. Hair is clearly long down her right side
// only; the left tucks behind her ear at the shoulder.
// 16x30. Hair is parted left and falls long down ONE side only (her right):
// a solid 4px curtain from shoulder to hip, while the left tucks at the jaw.
// 16x24 - Mario-ish proportions to match Aiki. Hair long down one side only,
// sleeveless top so the arms are bare skin.
const GIRL_BASE = [
  "....oooooo......","..ohhhhhhhho....",".ohhhhhhhhhho...",".ohhHhhhhhhho...",
  ".ohfffffffffhho.",".ohfffffffffhho.",".ohfwifffwifhho.",".ohfiifffiifhho.",
  ".ohfffffffffhho.","..ohfffffffhho..","..ohhhhhhhhho...","...ogggggggohho.",
  "...fgggggggfhho.","...fgGGGGggfhho.","...fgggggggfhho.","...fgggggggfho..",
  "...ogggggggo....","...opppppppo....","...opppppppo....","...opppppppo....",
  "...opp...ppo....","...opp...ppo....","..osso...osso...","..oooo...oooo..."
];
const GIRL1 = GIRL_BASE, GIRL2 = GIRL_BASE;
// Brodie, Ivonne's British Shorthair, in his yellow shirt
const C_PAL = { o:'#14101a', c:'#8a93a0', C:'#aeb6c2', a:'#14101a', W:'#ffffff',
                n:'#e8909a', y:'#f2c233', Y:'#d4a41e', w:'#eef2f8', d:'#5a6270' };
const CAT_BODY = [
  "occcCnnCccco","wccCCCCCCccw","oyyyyyyyyyyo","oyyYYyyYYyyo",
  "occco..occco",".ooo....ooo."
];
const CAT1 = [
  ".oo......oo.",".occ....cco.","occCccccCcco","occcccccccco","ocaaccccaaco"
].concat(CAT_BODY);
const CAT2 = [
  ".oo......oo.",".occ....cco.","occCccccCcco","occcccccccco","ocddccccddco"
].concat(CAT_BODY);
// Protein Power Up tub - the shield pickup
const W_PAL = { o:'#14101a', l:'#eef0f6', L:'#c6cad6', b:'#24406e', B:'#3f6ea8',
                w:'#f4f4fa', r:'#e8243c', c:'#6ee0ff' };
const WHEY = [
  "..oooooooo..",".ollllllllo.",".oLLLLLLLLo.",".oooooooooo.",
  "obbbbbbbbbbo","obBbbbbbbbbo","obBwwwwwwwbo","obBwrrrrrwbo",
  "obBwwcccwwbo","obBwwwwwwwbo","obBbbbbbbbbo","obBbbbbbbbbo",
  ".obbbbbbbbo.",".oooooooooo.","..oooooooo.."
];
// One flower per leg of the route. Head is always rows 0-4 (7x5), stem below.
const STEM = { s:'#3e8a3e', l:'#5aa85a' };
const FLOWERS = [
  // Morocco - full ruffled rose-pink bloom
  { n:'PINK PEONY', c:'#e8669f', pal:{ p:'#e8669f', d:'#bf3f78' }, map:[
    ".ppppp.","pdpppdp","ppdddpp","pdpppdp",".ppppp.","...s...","..ls...","...sl..","...s...","...s..."] },
  // Mediterranean - tall peach floret spike
  { n:'PEACH GLADIOLUS', c:'#f7b07a', pal:{ g:'#f7b07a', d:'#dd8a4e' }, map:[
    "...g...","..gdg..",".ggggg.","..gdg..",".ggggg.","...s...","..ls...","...sl..","...s...","...s..."] },
  // Istanbul - pale pink star lily with stamens
  { n:'PINK LILY', c:'#f7bdd8', pal:{ p:'#f7bdd8', d:'#e48ab8', y:'#f2c233' }, map:[
    "p..p..p",".ppdpp.","pdpypdp",".ppdpp.","p..p..p","...s...","..ls...","...sl..","...s...","...s..."] },
  // Cappadocia - flat violet-blue star
  { n:'BLUE CLEMATIS', c:'#5f8fe0', pal:{ b:'#5f8fe0', d:'#3a63b8', w:'#e8f0ff' }, map:[
    ".b.b.b.","bbbbbbb","bbdwdbb","bbbbbbb",".b.b.b.","...s...","..ls...","...sl..","...s...","...s..."] },
  // Indian Ocean - heart-shaped spathe with upright spadix
  { n:'PINK ANTHURIUM', c:'#f09ac0', pal:{ p:'#f09ac0', d:'#d0719c', c:'#f7e9a8' }, map:[
    "...c...","ppp.ppp","pppdppp",".ppdpp.","..ppp..","...s...","..ls...","...sl..","...s...","...s..."] },
  // Indonesia - red hibiscus with protruding anthers
  { n:'HIBISCUS', c:'#ef4060', pal:{ r:'#ef4060', d:'#c42545', w:'#ffe8b0', y:'#f2c233' }, map:[
    ".rrrrr.","rrrdrrr","rrdwdrr",".rrdrr.","..yyy..","...s...","..ls...","...sl..","...s...","...s..."] }

let AC = null, muted = false;
function blip(f, d, type, vol) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(AC.destination);
    o.start();
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f * 0.5), AC.currentTime + d);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.stop(AC.currentTime + d + 0.02);
  } catch (e) {}
}
function jingle(notes) { notes.forEach((n, i) => setTimeout(() => blip(n, 0.16, 'square', 0.06), i * 110)); }

/* --------------------------------------------------------- jetpack thrust */
// One long-lived noise+rumble voice whose gain follows the button, so the
// roar swells the instant you thrust and dies away when you let go.
// Airy rocket rather than a buzzy motor: broadband noise with the low mud
// filtered out and a lowpass that sweeps wide open on thrust, plus a smooth
// sine for body. A sawtooth here is what made it sound like a lawnmower.
let jetGain = null, jetLP = null, jetSub = null;
function jetTick() {
  if (!AC) return;
  try {
    if (!jetGain) {
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const noise = AC.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const hp = AC.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 280;
      jetLP = AC.createBiquadFilter();
      jetLP.type = 'lowpass'; jetLP.frequency.value = 820; jetLP.Q.value = 1.1;
      jetGain = AC.createGain(); jetGain.gain.value = 0;
      noise.connect(hp); hp.connect(jetLP); jetLP.connect(jetGain);
      jetGain.connect(AC.destination);
      noise.start();
      jetSub = AC.createOscillator();
      const sg = AC.createGain();
      jetSub.type = 'sine'; jetSub.frequency.value = 110; sg.gain.value = 0.28;
      jetSub.connect(sg); sg.connect(jetGain);
      jetSub.start();
    }
    const on = thrust && state === 'play' && !muted && !paused && !userPaused;
    jetGain.gain.setTargetAtTime(on ? 0.1 : 0, AC.currentTime, on ? 0.03 : 0.09);
    jetLP.frequency.setTargetAtTime(on ? 3400 : 780, AC.currentTime, 0.09);
    jetSub.frequency.setTargetAtTime(on ? 155 : 105, AC.currentTime, 0.14);
  } catch (e) {}
}

/* ---------------------------------------------------------------------- BGM */
// Eb/G - Fm/Ab - Abmaj7 - Gm/Bb - Eb/G - Fm/C - Bb/D, one bar each, looping.
// Semitone offsets from C4. `bass` carries the inversion: it is the note that
// must sound lowest, so Eb/G puts G underneath an Eb triad, and so on.
const CHORDS = [
  { tones: [3, 7, 10, 15], bass: -5  },   // Eb/G      - Eb major, 1st inv
  { tones: [5, 8, 12, 17], bass: -4  },   // Fm/Ab     - F minor, 1st inv, high F
  { tones: [3, 7, 8, 12],  bass: -4  },   // Abmaj7    - the F moves up to G
  { tones: [2, 7, 10, 14], bass: -2  },   // Gm/Bb     - G minor, 1st inv
  { tones: [3, 7, 10, 15], bass: -5  },   // Eb/G      - Eb major, 1st inv
  { tones: [0, 5, 8, 12],  bass: -12 },   // Fm/C      - F minor, 2nd inv
  { tones: [2, 5, 10, 14], bass: -10 }    // Bb/D      - Bb major, 1st inv
];
// Shield theme: Bbm - Cm - Db7 - C, double time with a 16th lead on top.
const POWER = [
  { tones: [1, 5, 10, 13], bass: -2  },   // Bbm  - Bb Db F
  { tones: [0, 3, 7, 12],  bass: -12 },   // Cm   - C Eb G
  { tones: [1, 5, 8, 11],  bass: -11 },   // Db7  - Db F Ab Cb(B)
  { tones: [0, 4, 7, 12],  bass: -12 }    // C    - C E G
];
const BAR = 1.9, ARP = [0, 1, 2, 3, 2, 1, 2, 3];
const LEAD = [3, 2, 3, 1, 2, 3, 2, 0];           // shield-mode 16th lead
let bgmBus = null, bgmNext = 0, bgmStep = 0, bgmFast = false;

function nf(semi) { return 261.63 * Math.pow(2, semi / 12); }
function tone(f, at, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(bgmBus);
  o.start(at); o.stop(at + dur + 0.03);
}
// The theme plays on the title, goes quiet for the journey, then swells back
// in across the Indonesia leg and carries through the arrival.
const powered = () => state === 'play' && shield > 0;
function bgmTarget() {
  if (muted || paused || userPaused) return 0;
  if (state === 'title' || state === 'intro' || state === 'outro'
      || state === 'arrive' || state === 'win') return 1;
  if (state !== 'play') return 0;
  if (powered()) return 1;                        // shield theme always audible
  const zp = (worldX - 5 * ZONE_PX) / ZONE_PX;    // 0 entering Indonesia, 1 at the end
  return Math.max(0, Math.min(1, zp / 0.6));      // full by ~60% through the leg
}
// Scheduled against AudioContext time with a lookahead, so the beat stays
// steady even when a frame runs long.
function bgmTick() {
  if (!AC) return;
  try {
    if (!bgmBus) { bgmBus = AC.createGain(); bgmBus.gain.value = 0; bgmBus.connect(AC.destination); }
    const tgt = bgmTarget();
    bgmBus.gain.setTargetAtTime(tgt, AC.currentTime, 0.45);
    // While silent, stop queueing notes entirely; restart the progression from
    // the top when it next comes in.
    if (tgt < 0.01) { bgmNext = 0; bgmStep = 0; return; }
    if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + 0.08;
    while (bgmNext < AC.currentTime + 0.5) {
      // With the shield up, swap to the Bbm-Cm-Db7-C theme at double time
      // with a bright 16th-note lead over it.
      const fast = powered(), bar = fast ? BAR / 2 : BAR;
      if (fast !== bgmFast) { bgmFast = fast; bgmStep = 0; }   // restart cleanly
      const table = fast ? POWER : CHORDS;
      const ch = table[bgmStep % table.length];
      tone(nf(ch.bass), bgmNext, bar * 0.28, 'triangle', 0.085);
      tone(nf(ch.bass), bgmNext + bar / 2, bar * 0.28, 'triangle', 0.085);
      for (let i = 0; i < 8; i++)
        tone(nf(ch.tones[ARP[i]] + 12), bgmNext + i * (bar / 8), bar * 0.09, 'square', 0.032);
      if (fast) for (let i = 0; i < 16; i++)
        tone(nf(ch.tones[LEAD[i % LEAD.length]] + 24), bgmNext + i * (bar / 16),
             bar * 0.045, 'square', 0.026);
      bgmNext += bar;
      bgmStep++;
    }
  } catch (e) {}
}

/* ------------------------------------------------------------------- input */
// Browsers won't start audio until a real gesture. The catch on phones: a touch
// only counts when the finger LIFTS (touchend / pointerup / click) - touching
// down (touchstart / pointerdown) never unlocks it. The first version listened
// for pointerdown only, so on a phone the audio engine was created but stayed
// suspended for the whole session. Listen for the lift, keep retrying until the
// context is genuinely running, and play one silent sample, which iOS requires.
let audioReady = false;
const unlockAudio = () => {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume();
    if (!audioReady) {
      const src = AC.createBufferSource();
      src.buffer = AC.createBuffer(1, 1, 22050);
      src.connect(AC.destination);
      src.start(0);
    }
    if (AC.state === 'running') audioReady = true;
  } catch (e) {}
};
for (const ev of ['keydown', 'pointerup', 'touchend', 'mouseup', 'click'])
  addEventListener(ev, unlockAudio, { capture: true, passive: true });
// iOS also suspends audio when the page is backgrounded; wake it on return.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { audioReady = false; unlockAudio(); } });

resize();                                  // first fit; needs `thrust` to exist
const press = () => {

  if (state === 'title') { state = 'intro'; cineI = 0; cineT = 0; }
  else if (state === 'intro') cineSkip(INTRO, newGame);
  else if (state === 'outro') cineSkip(OUTRO, finishWin);
  else if (state === 'win') state = 'title';
  else if (state === 'down') retryZone();
  else thrust = true;
};
// A press jumps to the next scene; past the last one, move on.
function cineSkip(list, done) {
  cineI++; cineT = 0;
  if (cineI >= list.length) done();
}

});

/* ---------------------------------------------------------------- spawning */
function addZap(o) {
  zaps.push({ wx: o.wx, y: o.y, len: o.len, ang: o.ang || 0, rot: o.rot || 0,
              amp: o.amp || 0, spd: o.spd || 1.4, ph: Math.random() * 6 });
}
function coinRun(x, y, n, arc) {
  for (let i = 0; i < n; i++) {
    const t = n > 1 ? i / (n - 1) : 0;
    letters.push({ wx: x + i * 13, y: y - (arc ? Math.sin(t * Math.PI) * 32 : 0),
                   ph: Math.random() * 6, k: zoneIdx });
  }
}
function spawnPattern() {
  const d = zoneIdx, x = nextX;
  const pool = ['h', 'h', 'v', 'gap', 'coins'];
  if (d >= 1) pool.push('rot', 'rot');
  if (d >= 2) pool.push('bob', 'bob', 'coins');
  if (d >= 3) pool.push('cross', 'gap');
  const pick = pool[(Math.random() * pool.length) | 0];
  const lo = CEIL + 14, hi = GROUND - 14, mid = (lo + hi) / 2;

  if (pick === 'h') {
    addZap({ wx: x, y: lo + Math.random() * (hi - lo), len: 46 + Math.random() * 42, ang: 0 });
    if (Math.random() < 0.5) coinRun(x - 40, mid, 4, true);
  } else if (pick === 'v') {
    const len = 44 + Math.random() * 34;
    const top = Math.random() < 0.5;
    addZap({ wx: x, y: top ? lo + len / 2 : hi - len / 2, len: len, ang: Math.PI / 2 });
    coinRun(x + 22, top ? hi - 16 : lo + 16, 4, false);
  } else if (pick === 'gap') {
    const gapY = lo + 26 + Math.random() * (hi - lo - 52);
    const gap = 46 - d * 2;
    const tl = gapY - gap / 2 - lo, bl = hi - (gapY + gap / 2);
    if (tl > 8) addZap({ wx: x, y: lo + tl / 2, len: tl, ang: Math.PI / 2 });
    if (bl > 8) addZap({ wx: x, y: hi - bl / 2, len: bl, ang: Math.PI / 2 });
    coinRun(x - 6, gapY, 3, false);
  } else if (pick === 'rot') {
    addZap({ wx: x, y: lo + 20 + Math.random() * (hi - lo - 40), len: 52 + Math.random() * 22,
             ang: Math.random() * 3, rot: (Math.random() < 0.5 ? -1 : 1) * (1.1 + Math.random() + d * 0.1) });
  } else if (pick === 'bob') {
    addZap({ wx: x, y: mid + (Math.random() - 0.5) * 40, len: 50 + Math.random() * 30,
             ang: 0, amp: 24 + Math.random() * 16, spd: 1.2 + Math.random() * 0.9 });
  } else if (pick === 'cross') {
    const y = lo + 24 + Math.random() * (hi - lo - 48);
    addZap({ wx: x, y: y, len: 56, ang: 0.7 });
    addZap({ wx: x, y: y, len: 56, ang: -0.7 });
  } else {
    coinRun(x, lo + 24 + Math.random() * (hi - lo - 48), 6, Math.random() < 0.6);
  }
  nextX += (pick === 'coins' ? 120 : 166 - d * 8) + Math.random() * 54;
}

/* ------------------------------------------------- keeping pickups reachable */
// How far a point sits from every nearby zapper's swept area. Rotating ones
// sweep a full disc; bobbing ones sweep their segment plus the bob amplitude.
function zapClearance(px, py) {
  let worst = 1e9;
  for (const z of zaps) {
    if (Math.abs(z.wx - px) > 120) continue;
    let d;
    if (z.rot) {
      d = Math.hypot(z.wx - px, z.y - py) - z.len / 2;
    } else {
      const hx = Math.cos(z.ang) * z.len / 2, hy = Math.sin(z.ang) * z.len / 2;
      d = segDist(z.wx - hx, z.y - hy, z.wx + hx, z.y + hy, px, py) - (z.amp || 0);
    }
    if (d < worst) worst = d;
  }
  return worst;
}
// Only search the strip whose patterns have already been generated, so the
// clearance we measure is the clearance the player will actually meet.
function findPickupSpot() {
  const lo = CEIL + 20, hi = GROUND - 20;
  let best = null, bestClear = -1e9;
  for (let sx = worldX + VW + 12; sx <= worldX + VW + 72; sx += 12) {
    for (let i = 0; i <= 13; i++) {
      const py = lo + (hi - lo) * (i / 13);
      const c = zapClearance(sx, py);
      if (c >= 20) return { wx: sx, y: py };     // comfortably clear
      if (c > bestClear) { bestClear = c; best = { wx: sx, y: py }; }
    }
  }
  return bestClear >= 14 ? best : null;          // nothing safe enough
}

/* ----------------------------------------------------------------- effects */
function burst(x, y, col, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (spread || 60) * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.5, col, g: 120 });
  }
}
function hearts_burst(x, y) {
  for (let i = 0; i < 14; i++)
    parts.push({ x: x + (Math.random() - 0.5) * 20, y, vx: (Math.random() - 0.5) * 24,
                 vy: -20 - Math.random() * 40, life: 1.4, col: '#ff5f8d', g: -14, heart: true });
}

/* ----------------------------------------------------------------- bouquet */
// Lay the picked flowers into a dome, in proportion to what was collected.
function buildBouquet() {
  const slots = [[0, -4]];
  [[11, 6], [20, 9], [28, 11]].forEach(a => {
    for (let i = 0; i < a[1]; i++) {
      const t = Math.PI + (i + 0.5) / a[1] * Math.PI;
      slots.push([Math.round(Math.cos(t) * a[0] * 1.15), Math.round(-4 + Math.sin(t) * a[0] * 0.8)]);
    }
  });
  const total = picked.reduce((a, b) => a + b, 0);
  const seq = [];
  if (!total) seq.push(0);
  else for (let k = 0; k < 6; k++) {
    let n = Math.round(picked[k] / total * slots.length);
    if (picked[k] > 0 && n === 0) n = 1;
    for (let j = 0; j < n; j++) seq.push(k);
  }
  // scatter so species mix instead of banding, and fill back-to-front
  const order = slots.map((s, i) => i).sort((a, b) => hash(a * 3.7) - hash(b * 3.7));
  bouquet = order.map((si, i) => ({ dx: slots[si][0], dy: slots[si][1], k: seq[i % seq.length] }))
                 .sort((a, b) => a.dy - b.dy);
}
function drawBouquet(cx, baseY) {
  if (!bouquet) return;
  const headY = baseY - 34;
  for (const f of bouquet) pxLine(cx + f.dx, headY + f.dy + 2, cx, baseY - 8, '#3e8a3e', 1);
  for (let r = 0; r < 18; r++) {                       // paper wrap
    const w = 24 - r * 0.95;
    rect(cx - w / 2, baseY - 18 + r, w, 1, r < 3 ? '#f6eddc' : '#e0cfae');
  }
  rect(cx - 8, baseY - 11, 16, 3, '#d9304a');          // ribbon
  rect(cx - 2, baseY - 13, 4, 8, '#c22741');
  for (const f of bouquet)
    drawSprite(FLOWERS[f.k].head, FLOWERS[f.k].pal, cx + f.dx - 3, headY + f.dy - 2, false);
}

/* ------------------------------------------------------------------ update */
function hurt() {
  if (player.inv > 0 || shield > 0) return;
  hearts--; player.inv = 1.4; shake = 0.3; flash = 0.12;
  burst(player.x, player.y, '#ffd24d', 20, 110);
  blip(140, 0.3, 'sawtooth', 0.07);
  if (hearts <= 0) {
    deaths++;
    state = 'down';
    burst(player.x, player.y, '#ff6a4d', 30, 150);
    blip(90, 0.6, 'sawtooth', 0.08);
  }
}

function update(dt) {
  anim += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
  if (zoneFade < 1) zoneFade = Math.min(1, zoneFade + dt / 1.4);
  if (banner) { banner.t += dt; if (banner.t > 3) banner = null; }

  if (state === 'title') { worldX += 40 * dt; return; }

  if (state === 'intro' || state === 'outro') {
    const list = state === 'intro' ? INTRO : OUTRO;
    cineT += dt;
    if (cineT >= list[cineI].dur) {
      cineI++; cineT = 0;
      if (cineI >= list.length) { if (state === 'intro') newGame(); else finishWin(); }
    }
    return;
  }

  if (state === 'arrive') {
    arriveT += dt;
    speed = Math.max(0, speed - 70 * dt);
    worldX += speed * dt;
    player.vy += 520 * dt;
    player.y = Math.min(GROUND - 13, player.y + player.vy * dt);
    if (player.y >= GROUND - 13) { player.vy = 0; if (speed < 6 && packT < 0) player.x += 42 * dt; }
    girlX = VW - 70;
    if (player.x >= girlX - 10 && packT < 0) {        // he stops and shrugs the pack off
      packT = 0;
      blip(190, 0.22, 'square', 0.05);
    }
    if (packT >= 0) {
      packT += dt;
      if (packT > 1.9) {                       // then the closing cinematic
        state = 'outro'; cineI = 0; cineT = 0;
        jingle([523, 659, 784, 1047]);
      }
    }
    return;
  }
  if (state !== 'play') return;

  elapsed += dt;

  /* physics */
  if (shield > 0) shield -= dt;
  const sp = speed + (shield > 0 ? 55 : 0);
  worldX += sp * dt;
  player.vy += (thrust ? -1020 : 0) * dt + 520 * dt;
  player.vy = Math.max(-230, Math.min(245, player.vy));
  player.y += player.vy * dt;
  if (player.y > GROUND - 13) { player.y = GROUND - 13; player.vy = 0; }
  if (player.y < CEIL + 13) { player.y = CEIL + 13; player.vy = 0; }
  if (player.inv > 0) player.inv -= dt;

  /* jetpack exhaust: puffs born at the nozzle, then they billow and drift */
  for (const s of smoke) {
    s.x += s.vx * dt - sp * dt * 0.55;
    s.y += s.vy * dt;
    s.vy *= 0.94; s.vx *= 0.95;
    s.r += dt * 7;
    s.life -= dt;
  }
  smoke = smoke.filter(s => s.life > 0 && s.x > -24);
  if (thrust) {
    smokeT -= dt;
    if (smokeT <= 0) {
      smokeT = 0.03;
      smoke.push({ x: player.x - 7 + Math.random() * 3, y: player.y + 6,
                   vx: -18 - Math.random() * 26, vy: 26 + Math.random() * 34,
                   r: 1.4 + Math.random() * 1.4, life: 0.75 + Math.random() * 0.5, max: 1.25 });
    }
  }

  /* walking on water -> splash */
  for (const r of ripples) { r.t += dt; r.x -= sp * dt; }
  ripples = ripples.filter(r => r.t < 0.6 && r.x > -40);
  if (ZONES[zoneIdx].sea && player.y >= GROUND - 14.5) {
    splashT -= dt;
    if (splashT <= 0) {
      splashT = 0.038;
      for (let i = 0; i < 4; i++)
        parts.push({ x: player.x - 2 + Math.random() * 6, y: GROUND - 1,
                     vx: -50 - Math.random() * 90, vy: -40 - Math.random() * 70,
                     life: 0.28 + Math.random() * 0.3, col: '#ffffff', g: 300 });
      ripples.push({ x: player.x, t: 0 });
    }
  }

  /* zone progress */
  const zi = Math.min(ZONES.length - 1, Math.floor(worldX / ZONE_PX));
  if (zi !== zoneIdx) {
    prevZone = zoneIdx; zoneIdx = zi; zoneFade = 0;
    speed = 78 + zoneIdx * 9;
    banner = { t: 0, z: zi };
    jingle([440, 587]);
  }
  if (worldX >= TOTAL_PX) {
    state = 'arrive'; arriveT = 0; zaps = []; missiles = []; pickups = [];
    return;
  }

  /* spawning */
  while (nextX < worldX + VW + 80) spawnPattern();
  if (worldX > pickupX) {
    const spot = findPickupSpot();
    if (spot) {
      pickupX = worldX + 760 + Math.random() * 540;
      // No shields on the final leg - the run should end on your own flying.
      const noShield = zoneIdx >= 5;
      pickups.push({ wx: spot.wx, y: spot.y, ph: 0,
                     kind: (noShield || hearts < 3 || Math.random() < 0.3) ? 'heart' : 'shield' });
    } else {
      pickupX = worldX + 90;        // everything ahead is fouled, try again shortly
    }
  }
  if (zoneIdx >= 1) {
    missileT -= dt;
    if (missileT <= 0) {
      missileT = Math.max(3.4, 9.5 - zoneIdx * 1.1) + Math.random() * 2.5;
      missiles.push({ sx: VW + 4, y: player.y, st: 'warn', t: 0, beep: 0, hi: false });
    }
  }

  /* zappers */
  for (const z of zaps) {
    z.ang += z.rot * dt;
    z.ph += z.spd * dt;
    const sx = z.wx - worldX;
    if (sx < -120) { z.dead = true; continue; }
    if (sx > VW + 120) continue;
    const cy = z.y + (z.amp ? Math.sin(z.ph) * z.amp : 0);
    const hxv = Math.cos(z.ang) * z.len / 2, hyv = Math.sin(z.ang) * z.len / 2;
    z.x1 = sx - hxv; z.y1 = cy - hyv; z.x2 = sx + hxv; z.y2 = cy + hyv;
    if (segDist(z.x1, z.y1, z.x2, z.y2, player.x, player.y) < 7) {
      if (shield > 0) { z.dead = true; burst(sx, cy, '#ffe14d', 14, 90); }
      else hurt();
    }
  }
  zaps = zaps.filter(z => !z.dead);

  /* letters */
  for (const l of letters) {
    l.ph += dt * 5;
    const sx = l.wx - worldX;
    if (sx < -20) { l.dead = true; continue; }
    if (Math.abs(sx - player.x) < 8 && Math.abs(l.y - player.y) < 9) {
      l.dead = true; score += 1; picked[l.k]++;   // score IS the flower count
      burst(sx, l.y, FLOWERS[l.k].c, 5, 50);
      blip(760 + (score % 5) * 60, 0.07, 'square', 0.04);
    }
  }
  letters = letters.filter(l => !l.dead);

  /* pickups */
  for (const p of pickups) {
    p.ph += dt * 4;
    const sx = p.wx - worldX;
    if (sx < -20) { p.dead = true; continue; }
    if (Math.abs(sx - player.x) < 10 && Math.abs(p.y - player.y) < 11) {
      p.dead = true;
      if (p.kind === 'heart') {
        const full = hearts >= 3;
        hearts = Math.min(3, hearts + 1);
        toast = { s: full ? 'BULDAK! ALREADY FULL' : 'BULDAK! +1 LIFE', t: 0 };
        jingle([660, 880]);
      } else { shield = 4.5; toast = { s: 'POWER SHIELD!', t: 0 }; jingle([520, 700, 900]); }
      burst(sx, p.y, p.kind === 'heart' ? '#ff5f8d' : '#6ef0c0', 16, 90);
    }
  }
  pickups = pickups.filter(p => !p.dead);

  /* missiles */
  for (const m of missiles) {
    m.t += dt;
    if (m.st === 'warn') {
      m.y += (player.y - m.y) * Math.min(1, dt * 4);
      m.beep -= dt;
      if (m.beep <= 0) {                         // klaxon, rising as it closes in
        m.beep = 0.26;
        m.hi = !m.hi;
        blip(m.hi ? 1180 : 880, 0.12, 'square', 0.055);
      }
      if (m.t > 1.4) {
        m.st = 'fly';
        blip(420, 0.45, 'sawtooth', 0.07);       // launch whoosh
        blip(150, 0.5, 'triangle', 0.05);
      }
    } else {
      m.sx -= (205 + zoneIdx * 12) * dt;
      if (m.sx < -14) m.dead = true;
      if (Math.abs(m.sx - player.x) < 8 && Math.abs(m.y - player.y) < 7) {
        m.dead = true;
        if (shield > 0) { burst(m.sx, m.y, '#ffb14d', 18, 120); }
        else { burst(m.sx, m.y, '#ffb14d', 18, 120); hurt(); }
      }
    }
  }
  missiles = missiles.filter(m => !m.dead);
}

/* ---------------------------------------------------------------- painting */
function pal() {
  const a = ZONES[prevZone].p, b = ZONES[zoneIdx].p, t = zoneFade;
  const o = {};
  for (const k in b) o[k] = mix(a[k], b[k], t);
  return o;
}
function sky(p, sunAmt, sunY) {
  const bands = 20;
  for (let i = 0; i < bands; i++) {
    const t = i / (bands - 1);
    rect(0, Math.floor(i * GROUND / bands), VW, Math.ceil(GROUND / bands) + 1,
         rgb(mix(p.st, p.sb, t * t * 0.55 + t * 0.45)));
  }
  if (sunAmt > 0.02) {
    const cx = 232, cy = Math.floor(sunY);
    const core = rgb(mix(p.sb, [255, 250, 230], 0.75));
    ctx.globalAlpha = sunAmt * 0.1;
    for (let g = 20; g > 9; g -= 2) disc(cx, cy, g, core);
    ctx.globalAlpha = sunAmt;
    disc(cx, cy, 9, core);
    ctx.globalAlpha = 1;
  }
}
function disc(cx, cy, r, col) {
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    rect(cx - w, cy + dy, w * 2 + 1, 1, col);
  }
}
// Snap every parallax layer to whole pixels: sub-pixel scroll makes the
// rounded silhouettes shimmer column-by-column.
function layer(px, spacing, fn) {
  px = Math.floor(px);
  const s = Math.floor(px / spacing) - 1;
  for (let i = s; i < s + Math.ceil(VW / spacing) + 3; i++) fn(i * spacing - px, i);
}
/* ---- shared scenery pieces ---------------------------------------------- */
function hill(x, w, h, col, crestCol, step) {
  for (let k = 0; k < w; k++) {
    const yy = Math.floor(GROUND - h * Math.sin(k / w * Math.PI));
    rect(x + k, yy, 1, h + 8, col);
    if (crestCol && k % step === 0) rect(x + k, yy, 1, 1, crestCol);
  }
}
function birds(px, col, yTop, spread) {
  layer(px, 104, (x, i) => {
    if (hash(i * 3.37) > 0.42) return;
    const by = Math.floor(yTop + hash(i * 1.73) * spread + Math.sin(anim * 0.7 + i) * 2);
    const up = ((anim * 3.5 + i * 0.7) | 0) % 2;
    rect(x,     by + (up ? 0 : 1), 1, 1, col);
    rect(x + 1, by + (up ? 1 : 0), 1, 1, col);
    rect(x + 2, by + (up ? 0 : 1), 1, 1, col);
  });
}
// A dense band of little rooftops - what gives the reference art its depth.
function cityBand(px, spacing, baseY, col, litCol, spireChance) {
  layer(px, spacing, (x, i) => {
    const h = Math.floor(5 + hash(i * 2.11) * 13), w = Math.floor(7 + hash(i * 5.77) * 10);
    rect(x, baseY - h, w, h, col);
    if (litCol && hash(i * 9.13) < 0.34) rect(x + 2, baseY - h + 2, 1, 2, litCol);
    if (litCol && hash(i * 4.41) < 0.22) rect(x + w - 3, baseY - h + 5, 1, 2, litCol);
    if (hash(i * 7.31) < spireChance) {
      const s2 = x + (w >> 1);
      rect(s2, baseY - h - 6, 1, 6, col);
      rect(s2 - 1, baseY - h - 8, 3, 2, col);
    }
  });
}
function dome(cx, baseY, r, col, ribCol) {
  for (let dy = 0; dy < r; dy++) {
    const t = dy / r, w = Math.floor(r * Math.sqrt(Math.max(0, 1 - t * t)));
    rect(cx - w, baseY - dy, w * 2 + 1, 1, col);
  }
  if (ribCol) {
    for (let dy = 0; dy < r; dy += 3) {
      const t = dy / r, w = Math.floor(r * Math.sqrt(Math.max(0, 1 - t * t)));
      rect(cx - w, baseY - dy, 1, 1, ribCol);
      rect(cx + w, baseY - dy, 1, 1, ribCol);
    }
    rect(cx - r + 1, baseY - 1, r * 2 - 1, 1, ribCol);
  }
}
function minaret(x, baseY, h, col, ltCol) {
  rect(x, baseY - h, 3, h, col);
  if (ltCol) rect(x, baseY - h, 1, h, ltCol);
  rect(x - 1, baseY - h + 11, 5, 2, col);
  rect(x - 1, baseY - h + 23, 5, 2, col);
  for (let r = 0; r < 6; r++) rect(x + 1 - r * 0.4, baseY - h - 6 + r, 1 + r * 0.8, 1, col);
}
// Striped envelope drawn as vertical gores, like the real thing.
function balloon(x, i, hazeAmt, skyCol, scale) {
  const s = Math.max(3, Math.floor((4 + hash(i + 3) * 5) * (scale || 1)));
  const h = Math.round(s * 2.4);
  const by = Math.floor(14 + hash(i) * 62 + Math.sin(anim * 0.45 + i) * 3);
  const raw = ['#d9654a', '#c98a3c', '#4f8fd4', '#7a9a6a'][(hash(i + 9) * 4) | 0];
  const a = rgb(mix(hx(raw), skyCol, hazeAmt));
  const b = rgb(mix([248, 240, 226], skyCol, hazeAmt));
  for (let k = -s; k <= s; k++) {
    const hh = Math.round((h / 2) * Math.sqrt(Math.max(0, 1 - (k / s) * (k / s))));
    if (hh < 1) continue;
    rect(x + s + k, by + h / 2 - hh, 1, hh * 2, (Math.floor((k + s) / 2) % 2) ? a : b);
  }
  const by2 = by + h;
  rect(x + s - 1, by2 - 1, 1, 3, a);
  rect(x + s + 1, by2 - 1, 1, 3, a);
  rect(x + s - 2, by2 + 2, 5, Math.max(2, s >> 1), '#7a5330');
}
function clouds(px, col) {
  layer(px, 124, (x, i) => {
    if (hash(i * 4.11) > 0.6) return;
    const y = Math.floor(14 + hash(i) * 46), w = Math.floor(14 + hash(i + 2) * 18);
    rect(x, y, w, 4, col);
    rect(x + 3, y - 3, w - 8, 3, col);
    rect(x + 6, y - 5, Math.max(3, w - 14), 2, col);
  });
}
// Horseshoe gateway arch: draw the wall, then carve the opening out of it.
function archGate(x, baseY, w, h, col, ltCol, dark) {
  rect(x, baseY - h, w, h, col);
  rect(x, baseY - h, w, 1, ltCol);
  for (let c = 0; c * 7 < w - 3; c++) rect(x + 1 + c * 7, baseY - h - 3, 4, 3, col);
  rect(x + 2, baseY - h + 5, w - 4, 1, ltCol);
  const r = Math.floor(w / 2) - 5, cy = baseY - h + r + 9;
  for (let dy = -r; dy <= r * 0.45; dy++) {
    const ww = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
    rect(x + (w >> 1) - ww, cy + dy, ww * 2, 1, dark);
  }
  rect(x + (w >> 1) - r, cy + Math.floor(r * 0.45), r * 2, baseY - cy - Math.floor(r * 0.45), dark);
  for (let dy = -r - 2; dy <= 0; dy += 3) {               // arch voussoirs
    const ww = Math.floor(Math.sqrt(Math.max(0, (r + 2) * (r + 2) - dy * dy)));
    rect(x + (w >> 1) - ww, cy + dy, 2, 1, ltCol);
    rect(x + (w >> 1) + ww - 2, cy + dy, 2, 1, ltCol);
  }
}

function drawDeco(kind, px, p, alpha) {
  ctx.globalAlpha = alpha;
  const skyC = p.sb;
  const L = (base, d) => rgb(mix(base, skyC, d));      // push toward sky = further away
  const D = (base, d) => rgb(mix(base, [12, 10, 24], d));
  // Strong value separation is what sells the depth: hazy far, dark landmark,
  // darker city, near-black foreground.
  const hazeC = L(p.far, 0.58), farC = L(p.far, 0.06), farLt = L(p.far, 0.3);
  const midC = D(p.mid, 0.22), midLt = L(p.mid, 0.22), midDk = D(p.mid, 0.52);
  const nearC = D(p.mid, 0.82);
  const lit = '#ffd98a';

  if (kind === 'dune') {
    clouds(px * 0.05, 'rgba(255,255,255,0.8)');
    birds(px * 0.08, hazeC, 26, 30);
    layer(px * 0.12, 168, (x, i) =>                       // Atlas ridge, hazed out
      hill(x, Math.floor(130 + hash(i) * 90), Math.floor(34 + hash(i + 9) * 26), hazeC));
    layer(px * 0.26, 112, (x, i) =>                       // dunes with sunlit crests
      hill(x, Math.floor(84 + hash(i * 1.3) * 54), Math.floor(24 + hash(i + 3) * 18), farC, farLt, 3));
    cityBand(px * 0.4, 22, GROUND - 1, L(p.mid, 0.18), null, 0.22);   // distant medina
    layer(px * 0.56, 186, (x, i) => {                     // Bab-style gateway
      archGate(x, GROUND, 62, Math.floor(44 + hash(i) * 8), midC, midLt, midDk);
      archGate(x + 62, GROUND, 26, 26, midC, midLt, midDk);
      archGate(x - 26, GROUND, 26, 26, midC, midLt, midDk);
    });
    layer(px * 0.66, 112, (x, i) => {                     // riad walls + towers
      const h = Math.floor(18 + hash(i) * 12);
      rect(x, GROUND - h, 40, h, midC);
      rect(x, GROUND - h, 40, 1, midLt);
      for (let c = 0; c < 5; c++) rect(x + 1 + c * 8, GROUND - h - 3, 4, 3, midC);
      for (let c = 0; c < 3; c++) {
        rect(x + 5 + c * 12, GROUND - h + 6, 4, 5, midDk);
        rect(x + 5 + c * 12, GROUND - h + 5, 4, 1, midLt);
      }
    });
    layer(px * 0.82, 96, (x, i) => {                      // near palms / dark wall
      if (hash(i * 2.9) < 0.55) {
        const th = Math.floor(28 + hash(i) * 12);
        rect(x + 5, GROUND - th, 3, th, nearC);
        for (let a = -3; a <= 3; a++) rect(x + 6 + a * 5, GROUND - th - 2 + Math.abs(a) * 2, 5, 2, nearC);
        rect(x + 4, GROUND - th - 5, 5, 3, nearC);
      } else {
        const h = Math.floor(14 + hash(i + 2) * 10);
        rect(x, GROUND - h, 34, h, nearC);
        for (let c = 0; c < 4; c++) rect(x + 2 + c * 9, GROUND - h - 3, 4, 3, nearC);
      }
    });

  } else if (kind === 'boat') {
    birds(px * 0.08, hazeC, 28, 34);
    layer(px * 0.12, 190, (x, i) =>                       // hazy far coast
      hill(x, Math.floor(140 + hash(i) * 90), Math.floor(26 + hash(i + 2) * 22), hazeC));
    layer(px * 0.26, 150, (x, i) =>                       // headland
      hill(x, Math.floor(100 + hash(i * 1.7) * 70), Math.floor(22 + hash(i + 4) * 20), farC, farLt, 4));
    cityBand(px * 0.36, 19, GROUND - 1, L(p.mid, 0.12), lit, 0.18);    // whitewashed coast town
    layer(px * 0.58, 118, (x, i) => {                     // dhows
      const y = GROUND - 9 + Math.round(Math.sin(anim * 0.8 + i) * 2);
      for (let k = 0; k < 16; k++) rect(x + 11, y - 21 + k, 1 + k * 0.55, 1, midC);
      rect(x + 10, y - 22, 1, 22, midDk);
      rect(x + 3, y, 17, 3, midDk);
      rect(x + 5, y + 3, 13, 1, midDk);
    });
    layer(px * 0.85, 132, (x, i) =>                       // near dark rocks
      hill(x, 46, Math.floor(10 + hash(i * 3.1) * 8), nearC));

  } else if (kind === 'istanbul') {
    birds(px * 0.08, hazeC, 24, 38);
    layer(px * 0.12, 200, (x, i) =>                       // hazy hills across the strait
      hill(x, Math.floor(150 + hash(i) * 90), Math.floor(28 + hash(i + 7) * 20), hazeC));
    layer(px * 0.2, 176, (x, i) => {                      // the great mosque
      const bw = Math.floor(54 + hash(i) * 14), bh = Math.floor(22 + hash(i + 1) * 6);
      const cx = x + 10 + (bw >> 1), r = Math.floor(bw * 0.36);
      [[x + 2, 50, 12, 0], [x + bw + 16, 50, 12, 1]].forEach(m =>
        minaret(m[0], GROUND, Math.floor(m[1] + hash(i * 2.3 + m[3] * 9.1) * m[2]), farC, farLt));
      [[x + 13, 36, 8, 2], [x + bw + 5, 36, 8, 3]].forEach(m =>
        minaret(m[0], GROUND, Math.floor(m[1] + hash(i * 3.7 + m[3] * 4.3) * m[2]), farC, farLt));
      rect(x + 10, GROUND - bh, bw, bh, farC);

const MINI_PAL = { o:'#15121a', r:'#cf2f3a', R:'#e8545e', d:'#9b1f28',
                g:'#d8e8ec', t:'#5a2e34', w:'#eef0f2', e:'#e05050',
                k:'#22202a', m:'#9aa2ac', h:'#dfe3e9' };
const MINI = (() => {
  const W = 48, H = 26;
  const m = Array.from({ length: H }, () => '.'.repeat(W).split(''));
  const px = (x, y, c) => { if (y >= 0 && y < H && x >= 0 && x < W) m[y][x] = c; };
  const box = (x0, y0, x1, y1, c) => {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) px(x, y, c);
  };
  const circ = (cx, cy, r, c) => {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
      if (x * x + y * y <= r * r) px(cx + x, cy + y, c);
  };
  box(16, 2, 40, 10, 'r');                       // cabin
  box(16, 2, 40, 3, 't');                        // roof
  box(41, 2, 43, 3, 't');                        // roof overhang at the rear
  box(18, 4, 27, 9, 'g');                        // front window
  box(30, 4, 39, 9, 'g');                        // rear window
  box(28, 4, 29, 9, 'r');                        // B-pillar
  box(16, 4, 17, 8, 't');                        // A-pillar rake

  box(1, 12, 15, 12, 'R');                       // bonnet, a row lower
  box(1, 11, 15, 11, '.');
  box(16, 11, 46, 11, 'R');
  box(1, 20, 46, 21, 'd');                       // sill
  box(2, 15, 4, 17, 'w');                        // headlamp
  box(44, 15, 45, 17, 'e');                      // tail light

    circ(cx, 20, 3, 'm');
    circ(cx, 20, 1, 'h');

  const out = m.map(r => r.slice());

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

    if (N.some(([dx, dy]) => {

const INTRO = [
  { dur: 4.4, lines: ['JAKARTA.', 'ME, IVONNE, AND BRODIE.'], paint: () => {
      cineSunset();
      fg(() => {
        drawSprite(HERO_NOPACK, P_PAL, 116, GROUND - 26, false);
        drawSprite(GIRL1, G_PAL, 134, GROUND - 24, false);
        drawSprite(anim % 4 < 0.18 ? CAT2 : CAT1, C_PAL, 152, GROUND - 11, false);
      });
    } },
  { dur: 5.2, lines: ['A MISSION CALLED ME TO MOROCCO.',
                      'LEAVING IVONNE AND BRODIE.'], paint: t => {
      cineSunset();
      fg(() => {
        drawSprite(NOPACK_WALK[(anim * 7 | 0) % 4], P_PAL, 116 - t * 21, GROUND - 26, false);
        drawSprite(GIRL1, G_PAL, 134, GROUND - 24, false);
        drawSprite(CAT1, C_PAL, 152, GROUND - 11, false);
        // Ivonne's eyes sit at sprite cols 4-5 / 9-10 on row 6; Brodie's at
        // cols 2-3 / 8-9 on row 4.
        cryTears([138, 143], GROUND - 24 + 7, t, 11);
        cryTears([154, 160], GROUND - 11 + 5, t + 0.4, 6);
      });
    } },
  { dur: 4.8, lines: ['13000 KM FROM HER.', 'AND HER 22ND BIRTHDAY IS COMING.'], paint: () => {
      cineZone(0, 520);
      // pack is off his back, waiting on the sand next to him
      fg(() => {
        drawSprite(HERO_NOPACK, P_PAL, 148, GROUND - 26, false);
        drawSprite(JETPACK, P_PAL, 170, GROUND - 11, false);
      });
    } }
];
const mmss = s => Math.floor(s / 60) + 'M ' + (Math.floor(s) % 60) + 'S';
// Daytime Jakarta, four beats, each carrying one stat from the run.
const OUTRO = [
  { dur: 5.4,
    lines: ['I FOUND HER. FIRST STOP, CIMOL.'],
    stat: () => 'FLOWERS PICKED   ' + score,
    paint: t => {
      cineZone(5, TOTAL_PX + 260);
      fg(() => {
        drawSprite(HERO_NOPACK, P_PAL, 118, GROUND - 26, false);
        drawSprite(GIRL1, G_PAL, 142, GROUND - 24, false);
        drawSprite(anim % 4 < 0.18 ? CAT2 : CAT1, C_PAL, 164, GROUND - 11, false);
        drawSprite(CIMOL, CIMOL_PAL, 134, GROUND - 19 + Math.round(Math.sin(t * 2)), false);
        drawSprite(CIMOL, CIMOL_PAL, 156, GROUND - 17 - Math.round(Math.sin(t * 2.3)), false);
      });
    } },
  { dur: 5.4,
    lines: ['THEN WE RODE ACROSS JAKARTA.'],
    stat: () => 'DISTANCE FLOWN   13000 KM',
    paint: t => {
      cineZone(5, TOTAL_PX + 420 + t * 26);           // city slides by
      const bx = 104, hip = GROUND - 22;
      fg(() => {
        bikeWheels(bx, GROUND);
        seatedRider(GIRL1.slice(0, 17), G_PAL, bx + 4, hip, '#39404f', '#e8e8ee');
        seatedRider(HERO_NOPACK.slice(0, 19), P_PAL, bx + 17, hip, '#3a3f48', '#33373e');
        bikeBody(bx, GROUND);
      });
      for (let i = 0; i < 4; i++) {                   // speed lines, trailing off the screen's left
        const ph = ((t * 1.6) + i / 4) % 1;
        ctx.globalAlpha = 0.5 * (1 - ph);
        rect(OX + bx - 12 - ph * (26 + OX), GROUND - 13 - i * 4, 8, 1, '#ffffff');
        ctx.globalAlpha = 1;
      }
    } },
  { dur: 5.4,
    lines: ['AND WE DROVE OUT TO THE PARK.'],
    stat: () => 'TIME ' + mmss(elapsed) + '    CRASHES ' + deaths,
    paint: () => { parkScene(); } },
  { dur: 5.8,
    lines: ['HAPPY 22ND BIRTHDAY, IVONNE.', 'FROM ME AND BRODIE.'],
    paint: t => { parkScene(); fg(() => cineHearts(t, 150)); } }
];
function cineFrame(list, i, t) {
  list[i].paint(t);
  rect(0, 0, VW, 14, '#07060e');                   // letterbox
  rect(0, VH - 20, VW, 20, '#07060e');
  const fade = Math.max(0, Math.min(1, t * 2.4, (list[i].dur - t) * 2.4));
  // Run stats sit on the screen itself; the bar below is scene context only.
  if (list[i].stat) {
    const s = list[i].stat(), w = textW(s) + 12;
    const bx = Math.round((VW - w) / 2);
    ctx.globalAlpha = fade;
    rect(bx, 22, w, 13, 'rgba(10,8,22,0.66)');
    rect(bx, 22, w, 1, '#ffe9a8');
    rect(bx, 34, w, 1, '#ffe9a8');
    text(s, bx + 6, 26, '#ffe9a8', 1);
    ctx.globalAlpha = 1;
  }
  const ls = typeof list[i].lines === 'function' ? list[i].lines() : list[i].lines;
  ctx.globalAlpha = fade;
  for (let k = 0; k < ls.length; k++)
    ctext(ls[k], VH - 16 + k * 9, k ? '#bcd2ff' : '#ffe9a8', 1);
  ctx.globalAlpha = 1;
  for (let k = 0; k < list.length; k++)            // scene pips
    rect(6 + k * 6, 6, 4, 2, k === i ? '#ffe9a8' : '#3a3550');
  if ((anim * 1.4 | 0) % 2) text('SPACE = SKIP', VW - 52, 5, '#6d7a92', 1);
}

function drawZap(z, p) {
  if (z.x1 === undefined) return;
  const col = rgb(p.zap);
  pxLine(z.x1, z.y1, z.x2, z.y2, col, 3);
  if ((anim * 20 | 0) % 2) pxLine(z.x1, z.y1, z.x2, z.y2, '#ffffff', 1);
  for (const [x, y] of [[z.x1, z.y1], [z.x2, z.y2]]) {
    rect(x - 2, y - 2, 4, 4, '#8f98a8');
    rect(x - 1, y - 1, 2, 2, '#dfe4ec');
  }
}
function drawHero() {
  const flying = player.y < GROUND - 14.5 || player.vy < -1;
  const map = (state === 'win' || packT >= 0) ? HERO_NOPACK
            : flying ? HERO_FLY
            : HERO_WALK[(anim * 11 | 0) % 4];
  const x = player.x - 9, y = player.y - 13;
  for (const r of ripples) {                       // keep fading after lift-off
    const w = r.t * 66;
    ctx.globalAlpha = (1 - r.t / 0.6) * 0.85;
    rect(r.x - w / 2, GROUND + 1, 5, 1, '#ffffff');
    rect(r.x + w / 2 - 5, GROUND + 1, 5, 1, '#ffffff');
    ctx.globalAlpha = 1;
  }
  if (ZONES[zoneIdx].sea && !flying) {             // bow wave at his feet
    const b = Math.abs(Math.sin(anim * 14)) * 3;
    rect(x - 4, GROUND - 2 - b, 4, 3, 'rgba(255,255,255,0.9)');
    rect(x + 9, GROUND - 1 - b * 0.6, 4, 2, 'rgba(255,255,255,0.75)');
    rect(x - 7, GROUND - 1, 3, 1, 'rgba(255,255,255,0.5)');
  }
  if (thrust && state === 'play') {                   // nozzle flame
    const f = 5 + (Math.random() * 6 | 0);
    rect(x, y + 17, 3, f, '#ff7a2f');
    rect(x, y + 17, 3, f * 0.6, '#ffd23b');
    rect(x + 1, y + 17, 1, f * 0.35, '#fff6d8');
  }
  if (shield > 0) {
    // visible bubble so the protection is obvious; it flashes as it runs out
    const dying = shield < 1.6 && (anim * 9 | 0) % 2;
    if (!dying) {
      ctx.globalAlpha = 0.16;
      disc(player.x, player.y - 1, 14, '#8ef0ff');
      ctx.globalAlpha = 0.9;
      for (let a = 0; a < 30; a++) {
        const t = a / 30 * Math.PI * 2 + anim * 1.4;
        rect(Math.round(player.x + Math.cos(t) * 15),
             Math.round(player.y - 1 + Math.sin(t) * 16), 1, 1,
             a % 3 ? '#8ef0ff' : '#ffffff');
      }
      ctx.globalAlpha = 1;
    }
  }
  if (player.inv > 0 && (anim * 14 | 0) % 2) return;
  drawSprite(map, P_PAL, x, y, false);
}
function drawHud() {
  rect(0, 0, VW, 15, 'rgba(8,6,20,0.62)');
  const km = Math.min(TOTAL_KM, Math.floor(worldX * KM_PER_PX));
  text(km + '/' + TOTAL_KM + ' KM', 4, 2, '#ffffff', 1);
  const z = ZONES[zoneIdx];
  text(z.name, (VW - textW(z.name)) / 2, 2, '#ffe9a8', 1);
  for (let i = 0; i < 3; i++)
    drawSprite(HEART, { x: i < hearts ? '#ff4d6d' : '#4a3a4a' }, VW - 6 - (2 - i) * 7, 2, false);
  // progress bar
  rect(4, 10, VW - 8, 3, '#1a1630');
  const w = Math.max(1, (VW - 10) * Math.min(1, worldX / TOTAL_PX));
  rect(5, 11, w, 1, '#6ef0c0');
  for (let i = 1; i < ZONES.length; i++) rect(5 + (VW - 10) * i / ZONES.length, 10, 1, 3, '#3a3560');
  rect(4 + w, 9, 2, 5, '#ffffff');
  // letters
  drawSprite(FLOWERS[zoneIdx].head, FLOWERS[zoneIdx].pal, 4, 17, false);
  text(score, 13, 18, '#fff6e8', 1);
  if (shield > 0) {                                   // shield readout
    drawSprite(SHIELD_ICON, SHIELD_PAL, VW - 54, 16, false);
    const w = Math.round(32 * Math.min(1, shield / 6));
    rect(VW - 38, 20, 34, 5, '#163040');
    rect(VW - 37, 21, Math.max(0, w), 3,
         shield < 1.6 && (anim * 9 | 0) % 2 ? '#2a6070' : '#8ef0ff');
  }
}

function draw() {
  if (LAB) { drawLab(); return; }
  if (state === 'intro') { cineFrame(INTRO, Math.min(cineI, INTRO.length - 1), cineT); return; }
  if (state === 'outro') { cineFrame(OUTRO, Math.min(cineI, OUTRO.length - 1), cineT); return; }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
  const p = pal();
  const sunA = (ZONES[zoneIdx].sun ? zoneFade : 0) + (ZONES[prevZone].sun ? 1 - zoneFade : 0);
  const sunY = (ZONES[zoneIdx].sun || 90) * zoneFade + (ZONES[prevZone].sun || 90) * (1 - zoneFade);
  sky(p, sunA, sunY);

  // night sky extras for Malacca
  const nightAmt = (zoneIdx === 4 ? zoneFade : 0) + (prevZone === 4 ? 1 - zoneFade : 0);
  if (nightAmt > 0.02) {
    ctx.globalAlpha = nightAmt;
    for (let i = 0; i < 46; i++) {
      const sx = ((Math.floor(hash(i) * 2000 - worldX * 0.06) % VW) + VW) % VW;
      rect(sx, Math.floor(hash(i + 50) * 110 + 6), 1, 1, (anim * 1.5 + i) % 5 < 4 ? '#ffffff' : '#9fb8ff');
    }
    const mx = Math.floor(1200 - worldX * 0.05) % 2000;
    if (mx > -40 && mx < VW + 40) {
      for (let r = 0; r < 24; r++) {
        const ww = Math.sqrt(144 - (r - 12) * (r - 12)) * 2;
        rect(mx + 12 - ww / 2, 24 + r, ww, 1, '#f2eecd');
      }
      rect(mx + 14, 32, 4, 4, '#ded8b4'); rect(mx + 8, 40, 3, 3, '#ded8b4');
    }
    ctx.globalAlpha = 1;
  }

  if (zoneFade < 1 && prevZone !== zoneIdx) drawDeco(ZONES[prevZone].deco, worldX, p, 1 - zoneFade);
  drawDeco(ZONES[zoneIdx].deco, worldX, p, zoneFade);
  drawGround(p);

  if (state === 'title') {
    ctx.fillStyle = 'rgba(8,6,20,0.38)'; ctx.fillRect(0, 0, VW, VH);
    fg(() => {
      // Title block
      ctext('JETPACK TO JAKARTA', 20, '#ffe9a8', 2);
      ctext('MOROCCO - TURKEY - INDONESIA', 36, '#ff9fb8', 1);
      ctext("HOME FOR IVONNE'S 22ND BIRTHDAY", 46, '#ffd98a', 1);
      // Cast, all standing on one line at y=94
      drawSprite(HERO_FLY, P_PAL, 86, 68, false);
      rect(86, 91, 3, 5, '#ffd23b');
      for (let i = 0; i < 8; i++) rect(112 + i * 11, 80 + Math.sin(anim * 3 + i) * 2, 5, 1, '#ffffff');
      drawSprite(GIRL1, G_PAL, 196, 70, false);
      drawSprite(anim % 4 < 0.18 ? CAT2 : CAT1, C_PAL, 214, 83, false);
      // Controls
      ctext('HOLD SPACE OR TAP TO FLY', 102, '#ffffff', 1);
      ctext('DODGE THE ZAPPERS - PICK EVERY FLOWER', 112, '#bcd2ff', 1);
      // Pickup legend: two columns, icons and labels on a shared baseline,
      // the pair centred as a block.
      drawSprite(BULDAK, B_PAL, 83, 120, false);
      text('BULDAK = LIFE', 99, 126, '#ffd84d', 1);
      drawSprite(WHEY, W_PAL, 174, 121, false);
      text('POWER SHIELD', 189, 126, '#8ef0ff', 1);
      ctext('PRESS SPACE TO TAKE OFF', 146, (anim * 2 | 0) % 2 ? '#6ef0c0' : '#2f8f74', 1);
    }, OY);
    if (best) text('BEST BOUQUET: ' + best, 6, GROUND + 2, '#8f8fb0', 1);
    text('M = MUTE', VW - 26 - textW('M = MUTE'), GROUND + 2, '#8f8fb0', 1);   // clear of the full-screen button
    ctx.restore();
    return;
  }

  for (const z of zaps) drawZap(z, p);
  for (const l of letters) {
    const sx = l.wx - worldX;
    if (sx < -10 || sx > VW + 10) continue;
    const f = FLOWERS[l.k], w = Math.abs(Math.cos(l.ph));
    if (w < 0.22) rect(sx, l.y - 5, 1, 10, f.pal.s);
    else {
      ctx.save(); ctx.translate(sx, l.y); ctx.scale(Math.max(0.22, w), 1);
      drawSprite(f.map, f.pal, -3.5, -5, false); ctx.restore();
    }
  }
  for (const pk of pickups) {
    const sx = pk.wx - worldX;
    if (sx < -12 || sx > VW + 12) continue;
    const y = pk.y + Math.sin(pk.ph) * 3;
    if (pk.kind === 'heart') {
      for (let s = 0; s < 3; s++) {                       // steam
        const sy = y - 11 - s * 3 - ((anim * 9 + s * 2) % 4);
        rect(sx - 2 + Math.sin(anim * 4 + s * 2) * 2.5, sy, 2, 1, 'rgba(255,255,255,0.6)');
      }
      drawSprite(BULDAK, B_PAL, sx - 6, y - 8, false);
      drawSprite(HEART, { x: '#ff4d6d' }, sx + 7, y - 13, false);
    } else {
      ctx.globalAlpha = 0.5 + Math.sin(pk.ph) * 0.2;   // halo so it reads as protective
      disc(sx, y, 11, '#8ef0ff');
      ctx.globalAlpha = 1;
      drawSprite(WHEY, W_PAL, sx - 5, y - 6, false);
    }
  }
  for (const m of missiles) {
    if (m.st === 'warn') {
      const on = (anim * 8 | 0) % 2;
      // big flashing chevron + label, plus a tracer line showing its path
      ctx.globalAlpha = on ? 0.5 : 0.22;
      rect(0, m.y - 1, VW, 2, '#ff3b3b');
      ctx.globalAlpha = 1;
      const bx = VW - 22, col = on ? '#ff3b3b' : '#7a1818';
      for (let k = 0; k < 9; k++) rect(bx + 12 - k, m.y - 9 + k, 2, 2, col);
      for (let k = 0; k < 9; k++) rect(bx + 12 - k, m.y + 7 - k, 2, 2, col);
      rect(bx - 2, m.y - 4, 12, 9, on ? '#ff3b3b' : '#7a1818');
      text('!', bx + 2, m.y - 2, '#ffffff', 1);
      if (on) text('INCOMING', bx - 42, m.y - 14, '#ff6a6a', 1);
    } else {
      drawSprite(MISSILE, M_PAL, m.sx - 4, m.y - 2, false);
      const f = 3 + (Math.random() * 4 | 0);
      rect(m.sx + 5, m.y - 1, f, 2, '#ffb14d');
      rect(m.sx + 5, m.y - 1, f * 0.5, 2, '#fff3c4');
    }
  }

  for (const s of smoke) {                 // chunky exhaust puffs, hard pixel edges
    const t = 1 - Math.max(0, s.life / s.max);
    const m = t < 0.22 ? PUFF_S : t < 0.55 ? PUFF_M : PUFF_L;
    drawSprite(m, { x: SMOKE_RAMP[Math.min(3, (t * 4) | 0)] },
               s.x - (m[0].length >> 1), s.y - (m.length >> 1), false);
  }

  for (const pt of parts) {
    ctx.globalAlpha = Math.min(1, pt.life * 2.2);
    if (pt.heart) drawSprite(HEART, { x: pt.col }, pt.x, pt.y, false);
    else rect(pt.x, pt.y, 2, 2, pt.col);
  }
  ctx.globalAlpha = 1;

  if (state === 'arrive' || state === 'win') {
    drawSprite((anim * 3 | 0) % 2 ? GIRL1 : GIRL2, G_PAL, girlX, GROUND - 24, false);
    drawSprite(anim % 4 < 0.18 ? CAT2 : CAT1, C_PAL, girlX + 14, GROUND - 11, false);
  }
  if (state === 'arrive' && packT >= 0) {
    // the pack slides off his shoulders, drops, and settles in the grass
    const t = Math.min(1, packT / 0.75);
    const jx = player.x - 8 - t * 16;
    const jy = Math.min(GROUND - 11, player.y - 3 + t * t * 30);
    drawSprite(JETPACK, P_PAL, jx, jy, false);
    if (packT > 0.72 && packT < 1.0)                     // dust as it lands
      for (let i = 0; i < 5; i++)
        rect(jx - 2 + i * 3, GROUND - 1 - (i % 2), 2, 1, 'rgba(255,255,255,0.55)');
  }
  if (state !== 'down' || (anim * 8 | 0) % 2 === 0) drawHero();

  if (toast) {
    toast.t += 1 / 60;
    if (toast.t > 1.3) toast = null;
    else {
      ctx.globalAlpha = Math.min(1, (1.3 - toast.t) * 2.5);
      text(toast.s, player.x - textW(toast.s) / 2, player.y - 18 - toast.t * 12, '#ffe9a8', 1);
      ctx.globalAlpha = 1;
    }
  }

  if (state !== 'win') drawHud();

  if (banner && banner.t < 3) {
    const z = ZONES[banner.z];
    const a = banner.t < 0.3 ? banner.t / 0.3 : banner.t > 2.5 ? (3 - banner.t) / 0.5 : 1;
    ctx.globalAlpha = a;
    rect(0, 56, VW, 30, 'rgba(8,6,20,0.7)');
    rect(0, 56, VW, 1, '#ffe9a8'); rect(0, 85, VW, 1, '#ffe9a8');
    ctext(z.name, 62, '#ffe9a8', 2);
    ctext(z.sub, 78, '#bcd2ff', 1);
    ctx.globalAlpha = 1;
  }

  if (state === 'down') {
    ctx.fillStyle = 'rgba(8,6,20,0.72)'; ctx.fillRect(0, 0, VW, VH);
    fg(() => {
      ctext('JETPACK DOWN', 58, '#ff5f6d', 2);
      ctext('BUT IVONNE IS STILL WAITING', 80, '#ffffff', 1);
      ctext('RESTART FROM ' + ZONES[zoneIdx].name, 96, '#bcd2ff', 1);
      ctext('PRESS SPACE', 116, (anim * 2 | 0) % 2 ? '#6ef0c0' : '#2f8f74', 1);
    }, OY);
  }
  if (state === 'win') {
    ctx.fillStyle = 'rgba(8,6,20,0.5)'; ctx.fillRect(0, 0, VW, VH);
    // redraw the three of them above the scrim so they stay bright
    drawSprite(JETPACK, P_PAL, player.x - 24, GROUND - 11, false);   // shrugged off
    drawSprite(HERO_NOPACK, P_PAL, player.x - 9, player.y - 13, false);
    drawSprite(GIRL1, G_PAL, girlX, GROUND - 24, false);
    drawSprite(anim % 4 < 0.18 ? CAT2 : CAT1, C_PAL, girlX + 14, GROUND - 11, false);
    fg(() => {
      ctext('YOU MADE IT.', 10, '#ffe9a8', 2);
      ctext("HAPPY 22ND BIRTHDAY, IVONNE", 26, '#ff9fb8', 1);
      ctext('MOROCCO TO INDONESIA - 13000 KM', 36, '#bcd2ff', 1);
      drawBouquet(96, GROUND + 4 - OY);              // OY cancels the shift, so it sits on the ground
      text('A BOUQUET OF ' + score + ' FLOWERS', 172, 52, '#ffffff', 1);
      for (let k = 0, r = 0; k < 6; k++) if (picked[k]) {
        drawSprite(FLOWERS[k].head, FLOWERS[k].pal, 174, 62 + r * 10, false);
        text(picked[k] + ' ' + FLOWERS[k].n, 184, 64 + r * 10, '#e8e0f0', 1);
        r++;
      }
      text('CRASHES: ' + deaths, 172, 128, '#bcd2ff', 1);
      text('TIME: ' + Math.floor(elapsed / 60) + 'M ' + (Math.floor(elapsed) % 60) + 'S', 172, 138, '#bcd2ff', 1);
      if (score >= best) text('NEW BEST!', 172, 148, '#6ef0c0', 1);
    }, OY);
    ctext('PRESS SPACE TO FLY AGAIN', VH - 8, (anim * 2 | 0) % 2 ? '#6ef0c0' : '#2f8f74', 1);   // pinned to the bottom edge
  }

  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 4) + ')'; ctx.fillRect(0, 0, VW, VH); }
  ctx.restore();
}

/* -------------------------------------------------------------------- loop */
worldX = 0; zoneIdx = 0; prevZone = 0; zoneFade = 1;
player = { x: 56, y: GROUND - 18, vy: 0, inv: 0 };
zaps = []; letters = []; missiles = []; pickups = []; parts = [];
hearts = 3; score = 0; deaths = 0; elapsed = 0; shake = 0; flash = 0; shield = 0;
nextX = 0; pickupX = 1e9; missileT = 99; speed = 78; banner = null;

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  bgmTick();                       // runs while paused too, so the music fades out
  jetTick();
  if (!paused && !userPaused) { update(dt); draw(); }
  const showPz = state === 'play' && !paused;
  if (showPz !== pzShown) { pzShown = showPz; pzBtn.style.display = showPz ? 'block' : 'none'; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
